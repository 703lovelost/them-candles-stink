name: Docker Web Tests
on:
    push:
      branches: [ "feature/k8s-helm" ]
    pull_request:
      branches: [ "feature/k8s-helm" ]

jobs:
    main-test:
      environment: DOCKER
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v3

          - name: login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_TOKEN }}

          - name: build the containers and run them
            run: docker compose up --build --abort-on-container-exit

          - name: test-repo-app, docker tag && docker push
            run: |
              docker tag them-candles-stink-app 703lovelost/test-repo-app
              docker push 703lovelost/test-repo-app

          - name: test-repo-web, docker tag && docker push
            run: |
              docker tag them-candles-stink-web 703lovelost/test-repo-web
              docker push 703lovelost/test-repo-web
          
          - name: install helm
            uses: azure/setup-helm@v3
            with:
              version: 'v3.17.3'

          - name: package helm chart
            run: |
              helm package ./helm/test-repo-chart -d ./helm-package
              mkdir -p ./helm-package
              ls -la ./helm-package/

          - name: create github release and upload helm chart
            uses: softprops/action-gh-release@v1
            if: github.ref == 'refs/heads/feature/k8s-helm'
            with:
              files: ./helm-package/*.tgz
              generate_release_notes: true
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}